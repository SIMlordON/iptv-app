name: Compact EPG

# Every 6 hours: shrink the big guide to the channels of verified.m3u and commit docs/epg.xml.gz.
# Then enter https://raw.githubusercontent.com/<user>/<repo>/main/docs/epg.xml.gz in the app
# (Settings > Program (EPG)).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/epg_filter.py app/src/main/assets/verified.m3u docs/epg.xml.gz
      - name: Commit guide
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add docs/epg.xml.gz
          git diff --cached --quiet || git commit -m "Update EPG"
          git push
